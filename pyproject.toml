[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mrseqrec"
version = "0.1.0"
description = "Missingness-Invariant Multimodal Sequential Recommendation (MR-SeqRec)"
requires-python = ">=3.10"  # 兼容云 GPU 镜像（AutoDL 等默认 3.10/3.11），代码仅用 3.10 语法
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]  # 让 tests 可直接 import scripts/*（无 __init__.py 的命名空间包）
